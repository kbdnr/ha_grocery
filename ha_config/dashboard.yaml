          _No data yet — run the scraper._
          {% else %}
          | Item | Price | Sale |
          | --- | --- | --- |
          {% for item in items | sort(attribute='item_name') %}
          | {{ item.item_name }} | ${{ '%.2f' | format(item.price) }} | {{ item.sale_type }} |
          {% endfor %}
          {% endif %}

      - type: markdown
        title: Grocery Outlet This Week
        content: >
          {% set items = state_attr('sensor.grocery_outlet_ads', 'items') or [] %}
          {% if items | length == 0 %}
          _No data yet — run the scraper._
          {% else %}
          | Item | Price | Sale |
          | --- | --- | --- |
          {% for item in items | sort(attribute='item_name') %}
          | {{ item.item_name }} | ${{ '%.2f' | format(item.price) }} | {{ item.sale_type }} |
          {% endfor %}
          {% endif %}

      - type: markdown
        title: 99 Ranch Market — Weekly Flyer
        content: >
          {% set urls = state_attr('sensor.99_ranch_market_ads', 'urls') or [] %}
          {% if urls | length == 0 %}
          _No flyer found this week._
          {% else %}
          Valid through {{ states('sensor.99_ranch_market_ads') }}

          {% for url in urls %}
          ![flyer page]({{ url }})
          {% endfor %}
          {% endif %}

      - type: markdown
        title: Uwajimaya — Weekly Flyer
        content: >
          {% set urls = state_attr('sensor.uwajimaya_ads', 'urls') or [] %}
          {% if urls | length == 0 %}
          _No flyer found this week._
          {% else %}
          Valid through {{ states('sensor.uwajimaya_ads') }} —
          [open in a new tab]({{ urls[0] }})
          {% endif %}
      - type: iframe
        url: /api/grocery_ads/flyer/uwajimaya
        aspect_ratio: 141%

      - type: markdown
        title: New Seasons Market — Weekly Flyer
