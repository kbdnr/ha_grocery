  - title: Lowest Prices
    path: lowest-prices
    icon: mdi:cash-multiple
    cards:
      - type: markdown
        title: Best Price Per Item (H Mart, Zupan's, Albertsons, Safeway, Fred Meyer, Grocery Outlet, Costco, Uwajimaya)
        content: |
          {%- set prices = state_attr('sensor.lowest_price', 'prices') or {} -%}
          {% if prices | length == 0 -%}
          _No data yet — run the scraper._
          {% endif -%}
          {% for name, info in prices.items() | sort -%}
          **{{ name }}** — ${{ '%.2f' | format(info.price) }} @ {{ info.store }}
          {% endfor -%}

  - title: New Deals
    path: new-deals
    icon: mdi:new-box
    cards:
      - type: markdown
        title: New This Week
        content: |
          {%- set diff = state_attr('sensor.new_deals', 'diff') or {} -%}
          {%- set new_items = diff.get('new', []) -%}
          {% if new_items | length == 0 -%}
          _Nothing new since the last scrape._
          {% endif -%}
          {% for item in new_items -%}
          **{{ item.item_name }}** — ${{ '%.2f' | format(item.price) }} ({{ item.store }})
          {% endfor -%}

      - type: markdown
        title: Price Changes
        content: |
          {%- set diff = state_attr('sensor.new_deals', 'diff') or {} -%}
          {%- set changed = diff.get('changed', []) -%}
          {% if changed | length == 0 -%}
          _No price changes since the last scrape._
          {% endif -%}
          {% for change in changed -%}
          **{{ change.item.item_name }}** — ${{ '%.2f' | format(change.old_price) }} → ${{ '%.2f' | format(change.item.price) }} ({{ change.item.store }})
          {% endfor -%}

      - type: markdown
        title: Dropped
        content: |
          {%- set diff = state_attr('sensor.new_deals', 'diff') or {} -%}
          {%- set dropped = diff.get('dropped', []) -%}
          {% if dropped | length == 0 -%}
          _Nothing dropped since the last scrape._
          {% endif -%}
          {% for item in dropped -%}
          **{{ item.item_name }}** ({{ item.store }})
          {% endfor -%}

  - title: Categories
    path: categories
    icon: mdi:shape-outline
    cards:
      - type: markdown
        title: Browse by Category
        content: |
          {%- set items = (state_attr('sensor.h_mart_ads', 'items') or [])
                          + (state_attr('sensor.zupan_s_markets_ads', 'items') or [])
                          + (state_attr('sensor.albertsons_ads', 'items') or [])
                          + (state_attr('sensor.safeway_ads', 'items') or [])
                          + (state_attr('sensor.fred_meyer_ads', 'items') or [])
                          + (state_attr('sensor.grocery_outlet_ads', 'items') or [])
                          + (state_attr('sensor.costco_ads', 'items') or [])
                          + (state_attr('sensor.uwajimaya_ads', 'items') or []) -%}
          {%- set categories = items | map(attribute='category') | map('default', 'Uncategorized', true) | unique | sort | list -%}
          {% for cat in categories -%}
          ### {{ cat if cat else 'Uncategorized' }}
          {% for item in items if (item.category or 'Uncategorized') == cat -%}
          - **{{ item.item_name }}** — ${{ '%.2f' | format(item.price) }}{{ ' / ' + item.unit if item.unit else '' }} ({{ item.store }})
          {% endfor %}

          {% endfor -%}

  - title: Recipes
    path: recipes
    icon: mdi:silverware-fork-knife
    cards:
      - type: markdown
        title: Recipes On Sale This Week
        content: |
          {%- set recipes = state_attr('sensor.recipes_on_sale', 'recipes') or [] -%}
          {% if recipes | length == 0 -%}
          _Nothing yet — either no Mealie entry is set up, its first sync is
          still running, or no recipe has a fresh ingredient in this week's ads._
          {%- else -%}
          Top {{ recipes | length }} of {{ states('sensor.recipes_on_sale') }} recipes with a
          fresh ingredient on sale
          ({{ state_attr('sensor.recipes_on_sale', 'recipes_with_foods') }} of
          {{ state_attr('sensor.recipes_on_sale', 'recipes_indexed') }} Mealie recipes have parsed ingredients).

          {% for recipe in recipes -%}
          ### [{{ recipe.name }}]({{ recipe.url }})
          {{ recipe.on_sale }} of {{ recipe.ingredients }} ingredients on sale
          {% for match in recipe.matches -%}
          - **{{ match.food }}** — ${{ '%.2f' | format(match.price) }} @ {{ match.store }} _({{ match.item }})_
          {% endfor %}

          {% endfor -%}
          {%- endif %}

      - type: markdown
        title: Ingredients On Sale
        content: |
          {%- set foods = state_attr('sensor.recipes_on_sale', 'foods') or {} -%}
          {% if foods | length == 0 -%}
          _No ad items matched a Mealie food yet._
          {% endif -%}
          {% for food, offer in foods.items() -%}
          **{{ food }}** — ${{ '%.2f' | format(offer.price) }} @ {{ offer.store }} _({{ offer.item }})_
          {% endfor -%}
