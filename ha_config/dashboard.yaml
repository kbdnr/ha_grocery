# Grocery Ads — tabbed Lovelace dashboard.
#
# In HA: Settings -> Dashboards -> Add Dashboard -> "Grocery Ads",
# then switch to YAML mode and paste this in. Built entirely from
# `markdown` cards templated off the entities the `grocery_ads` HACS
# custom integration creates (custom_components/grocery_ads/) — one
# config entry per store, added via Settings -> Devices & Services ->
# Add Integration. No custom Lovelace cards required — the PDF flyers use
# the built-in `iframe` card type.
#
# PDF flyers embed via the integration's own `/api/grocery_ads/flyer/
# <store_type>` HTTP view (custom_components/grocery_ads/http.py) rather
# than the sensor's `urls` attribute directly, for two reasons: that
# attribute's value is a real store CDN URL that gets re-scraped (and
# changes) every week, but a native Lovelace `iframe` card's `url` is a
# static YAML value with no templating support — and several of these
# store sites set X-Frame-Options/CSP headers that refuse to be framed by
# anyone else's page, which blocks the iframe outright if it's pointed at
# the store's URL directly (even via a redirect, since the browser still
# ends up navigating there). So the view fetches the flyer bytes
# server-side and serves them back same-origin: the iframe's `src` never
# leaves this HTTP view, and it always has whatever flyer the coordinator
# most recently found.
#
# Entity ids below follow HA's standard has_entity_name + device_info
# derivation: each store's device is named per STORE_REGISTRY (const.py)
# and its sensor entity name is "Ads", so the entity id slugifies to
# `sensor.<device_name>_ads` (e.g. device "H Mart" -> sensor.h_mart_ads).
# The two aggregate sensors have no device, so their entity id slugifies
# from _attr_name alone (sensor.lowest_price, sensor.new_deals). Verify
# these against Settings -> Devices & Services -> Entities after
# installing, since a renamed device changes its entity id.
#
# Two kinds of stores feed this:
#  - Structured (H Mart, Zupan's, Albertsons, Safeway, Fred Meyer, Grocery
#    Outlet, Costco, Uwajimaya): individual items with price/category (the
#    last six also lack a clean `unit` field — Flipp's item data doesn't
#    provide one), so they drive the Lowest Price / New Deals / Category
#    tabs. The last six go through a shared third-party aggregator (Flipp)
#    rather than each store's own site backend — see CLAUDE.md.
#  - Flyer-only (99 Ranch, New Seasons, Market of Choice, Asian Family
#    Market): the weekly ad is a PDF or a set of flyer images with no
#    machine-readable item data, so they're shown directly (inline images,
#    or a link to the PDF) on the Raw Feed tab only — they can't participate
#    in price comparison or diffing. Each flyer store has its own sensor
#    (there is no combined "flyers" sensor); its `urls`/`media_type`
#    attributes and its state (the flyer's valid_to date) come from that
#    store's own entity.
#  - Uwajimaya is both: its sensor's state is the item count like any other
#    structured store, and it also carries the PDF's `urls`/`media_type`
#    plus a `flyer_valid_to` attribute (where a flyer-only store uses its
#    state for that date).
#
# The Recipes tab needs the "Mealie (recipes on sale)" config entry, added
# from the same Add Integration dialog as the stores. It creates
# sensor.recipes_on_sale: Mealie recipes ranked by how much of what they
# need is in this week's ads, matched through Mealie's own foods/aliases.

title: Grocery Ads
views:
  - title: Raw Feed
    path: raw-feed
    icon: mdi:cart
    cards:
      - type: markdown
        title: H Mart This Week
        content: |
          {%- set items = state_attr('sensor.h_mart_ads', 'items') or [] -%}
          {% if items | length == 0 -%}
          _No data yet — run the scraper._
          {%- else -%}
          | Item | Price | Sale |
          | --- | --- | --- |
          {% for item in items | sort(attribute='item_name') -%}
          | {{ item.item_name }} | ${{ '%.2f' | format(item.price) }} / {{ item.unit }} | {{ item.sale_type }} |
          {% endfor -%}
          {%- endif %}

      - type: markdown
        title: Zupan's This Week
        content: |
          {%- set items = state_attr('sensor.zupan_s_markets_ads', 'items') or [] -%}
