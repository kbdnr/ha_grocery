  - title: Lowest Prices
    path: lowest-prices
    icon: mdi:cash-multiple
    cards:
      - type: markdown
        title: Best Price Per Item (H Mart, Zupan's, Albertsons, Safeway, Fred Meyer, Grocery Outlet)
        content: >
          {% set prices = state_attr('sensor.lowest_price', 'prices') or {} %}
          {% if prices | length == 0 %}
          _No data yet — run the scraper._
          {% endif %}
          {% for name, info in prices.items() | sort %}
          **{{ name }}** — ${{ '%.2f' | format(info.price) }} @ {{ info.store }}
          {% endfor %}

  - title: New Deals
    path: new-deals
    icon: mdi:new-box
    cards:
      - type: markdown
        title: New This Week
        content: >
          {% set diff = state_attr('sensor.new_deals', 'diff') or {} %}
          {% set new_items = diff.get('new', []) %}
          {% if new_items | length == 0 %}
          _Nothing new since the last scrape._
          {% endif %}
          {% for item in new_items %}
          **{{ item.item_name }}** — ${{ '%.2f' | format(item.price) }} ({{ item.store }})
          {% endfor %}

      - type: markdown
        title: Price Changes
        content: >
          {% set diff = state_attr('sensor.new_deals', 'diff') or {} %}
          {% set changed = diff.get('changed', []) %}
          {% if changed | length == 0 %}
          _No price changes since the last scrape._
          {% endif %}
          {% for change in changed %}
          **{{ change.item.item_name }}** — ${{ '%.2f' | format(change.old_price) }} → ${{ '%.2f' | format(change.item.price) }} ({{ change.item.store }})
          {% endfor %}

      - type: markdown
        title: Dropped
        content: >
          {% set diff = state_attr('sensor.new_deals', 'diff') or {} %}
          {% set dropped = diff.get('dropped', []) %}
          {% if dropped | length == 0 %}
          _Nothing dropped since the last scrape._
          {% endif %}
          {% for item in dropped %}
          **{{ item.item_name }}** ({{ item.store }})
          {% endfor %}

  - title: Categories
    path: categories
    icon: mdi:shape-outline
    cards:
      - type: markdown
        title: Browse by Category
        content: >
          {% set items = (state_attr('sensor.h_mart_ads', 'items') or [])
                          + (state_attr('sensor.zupan_s_markets_ads', 'items') or [])
                          + (state_attr('sensor.albertsons_ads', 'items') or [])
                          + (state_attr('sensor.safeway_ads', 'items') or [])
                          + (state_attr('sensor.fred_meyer_ads', 'items') or [])
                          + (state_attr('sensor.grocery_outlet_ads', 'items') or []) %}
          {% set categories = items | map(attribute='category') | map('default', 'Uncategorized', true) | unique | sort | list %}
          {% for cat in categories %}
          ### {{ cat if cat else 'Uncategorized' }}
          {% for item in items if (item.category or 'Uncategorized') == cat %}
          - **{{ item.item_name }}** — ${{ '%.2f' | format(item.price) }}{{ ' / ' + item.unit if item.unit else '' }} ({{ item.store }})
          {% endfor %}

          {% endfor %}
