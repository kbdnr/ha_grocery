          | --- | --- | --- |
          {% for item in items | sort(attribute='item_name') %}
          | {{ item.item_name }} | ${{ '%.2f' | format(item.price) }} | {{ item.sale_type }} |
          {% endfor %}
          {% endif %}

      - type: markdown
        title: Fred Meyer This Week
        content: >
          {% set items = state_attr('sensor.fred_meyer_ads', 'items') or [] %}
